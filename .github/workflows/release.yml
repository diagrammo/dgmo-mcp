name: Release

# 🔴 THIS WORKFLOW IS THE PUBLISHER as of 2026-08-14 — npm, the MCP registry and
# the .mcpb bundle, all three. It authenticates to npm over Trusted Publishing
# (OIDC) and to the MCP registry over `mcp-publisher login github-oidc`, so
# there is no stored credential on either side. The local `npm publish` path it
# replaced is going away: npm strips direct publish from bypass-2FA tokens in
# January 2027.
# https://github.blog/changelog/2026-07-31-restricting-npm-bypass-2fa-granular-access-tokens/
#
# 🔴 This is also the only path that does not need an interactive MCP-registry
# login. That login mints a JWT lasting about five minutes and can never be a
# stored secret, so publishing from here removes a manual step as well as a
# credential.
#
# 🔴 The trusted-publisher registration on npmjs.com names this REPO and this
# FILENAME. Renaming or moving this file stops publishing until someone updates
# the registration by hand at npmjs.com → the package → Settings → Trusted
# publisher. A token cannot do it — npm removed that power from bypass-2FA
# tokens on 2026-07-31.
#
# Dispatch-only on purpose: `scripts/release.sh` in the workspace bumps, tags,
# pushes, and then dispatches this workflow at the tag. By hand:
#   gh workflow run release.yml -R diagrammo/dgmo-mcp --ref vX.Y.Z
#
# Actions minutes: this repo is PUBLIC, so runs are free. The tag trigger came
# off 2026-07-22 to save minutes that were never being billed (verified
# 2026-08-14) — the cost worth avoiding is a run firing twice, not its minutes.
#
# 🔴 The note that used to sit here — "the org NPM_TOKEN is broken" — was a WRONG
# DIAGNOSIS, retracted 2026-07-31. No workflow in this repo has read a token
# since. A red run saying "cannot publish over the previously published
# versions" means a local publish beat CI to it; read the run's own log.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.19.0. Leave blank when dispatching on a tag ref.'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Resolve the tag being released
        # A dispatch can name the tag instead of being run ON it. That matters
        # because a fix to THIS file only exists on main until the next tag is
        # cut, so `--ref <tag>` would run the old workflow. Dispatching on main
        # with `-f tag=v0.19.0` runs the current one against the tagged commit.
        id: target
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="$GITHUB_REF_NAME"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::'$TAG' is not a version tag. Dispatch on a tag ref, or pass tag=vX.Y.Z."; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Verify tag matches package.json / manifest.json / server.json
        run: |
          TAG_VERSION="${{ steps.target.outputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")
          SERVER_PKG_VERSION=$(node -p "require('./server.json').packages[0].version")
          echo "tag=$TAG_VERSION pkg=$PKG_VERSION manifest=$MANIFEST_VERSION server=$SERVER_VERSION server.packages[0]=$SERVER_PKG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ] || \
             [ "$MANIFEST_VERSION" != "$TAG_VERSION" ] || \
             [ "$SERVER_VERSION" != "$TAG_VERSION" ] || \
             [ "$SERVER_PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch — bump package.json, manifest.json, and server.json (both top-level and packages[0]) to $TAG_VERSION before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Is this version already on npm?
        # Releases are cut LOCALLY (the tag trigger above is off), so by the time
        # this workflow is dispatched the tarball is usually already published.
        # Without this check the npm step fails with "cannot publish over the
        # previously published versions" and the job stops BEFORE the MCP
        # registry publish below — which is the only place that publish exists.
        # That is why the registry sat at 0.12.0 while npm was on 0.18.0.
        id: npm_state
        run: |
          VERSION="${{ steps.target.outputs.version }}"
          if npm view "@diagrammo/dgmo-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "✓ npm already has $VERSION — skipping the publish, continuing to the registry"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        # OIDC via npm Trusted Publishing (configured on npmjs.com). No stored
        # token; the id-token: write permission (already present here for the
        # MCP registry publish below) now also covers npm. Provenance attested.
        if: steps.npm_state.outputs.already == 'false'
        run: npm publish --access public --provenance

      - name: Wait for npm propagation
        if: steps.npm_state.outputs.already == 'false'
        run: |
          for i in 1 2 3 4 5 6; do
            if npm view "@diagrammo/dgmo-mcp@${{ steps.target.outputs.version }}" version >/dev/null 2>&1; then
              echo "✓ npm shows ${{ steps.target.outputs.version }}"
              exit 0
            fi
            echo "Waiting for npm registry... ($i/6)"
            sleep 10
          done
          echo "::warning::npm did not surface the new version within 60s — proceeding anyway"

      - name: Build .mcpb bundle
        run: bash scripts/bundle.sh

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version || true

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Attach .mcpb to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          # Explicit, because a dispatch on a branch has no tag to infer from.
          tag_name: ${{ steps.target.outputs.tag }}
          files: dgmo-mcp.mcpb
          fail_on_unmatched_files: true
          # NOT generate_release_notes — a local release writes its notes by
          # hand, and regenerating would replace them with a commit list.
          append_body: true
