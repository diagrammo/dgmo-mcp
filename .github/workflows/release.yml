name: Release

# Tag trigger disabled 2026-07-22 to cut Actions minutes. Releases are done
# locally (see the workspace release skill / release checklist), so a tag-driven
# run was spending minutes repeating work already done by hand.
#
# 🔴 The reason recorded here originally — "the org NPM_TOKEN is broken" — was a
# WRONG DIAGNOSIS, retracted 2026-07-31. The token authenticates fine, for scoped
# and unscoped packages alike. The CI runs that looked like auth failures say
# "You cannot publish over the previously published versions", because a local
# publish had already gone out. Read the failing run own log before re-deriving
# it; a red run kept confirming the story for weeks.
#
# So: rotating the token will NOT restore this trigger and is not a precondition
# for it. Restoring it is a deliberate choice about spending Actions minutes.
# (The token does still expire ~2026-08-15 — that is a real deadline, unrelated.)
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Verify tag matches package.json / manifest.json / server.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")
          SERVER_PKG_VERSION=$(node -p "require('./server.json').packages[0].version")
          echo "tag=$TAG_VERSION pkg=$PKG_VERSION manifest=$MANIFEST_VERSION server=$SERVER_VERSION server.packages[0]=$SERVER_PKG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ] || \
             [ "$MANIFEST_VERSION" != "$TAG_VERSION" ] || \
             [ "$SERVER_VERSION" != "$TAG_VERSION" ] || \
             [ "$SERVER_PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch — bump package.json, manifest.json, and server.json (both top-level and packages[0]) to $TAG_VERSION before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Publish to npm
        # OIDC via npm Trusted Publishing (configured on npmjs.com). No stored
        # token; the id-token: write permission (already present here for the
        # MCP registry publish below) now also covers npm. Provenance attested.
        run: npm publish --access public --provenance

      - name: Wait for npm propagation
        run: |
          for i in 1 2 3 4 5 6; do
            if npm view "@diagrammo/dgmo-mcp@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
              echo "✓ npm shows ${GITHUB_REF_NAME#v}"
              exit 0
            fi
            echo "Waiting for npm registry... ($i/6)"
            sleep 10
          done
          echo "::warning::npm did not surface the new version within 60s — proceeding anyway"

      - name: Build .mcpb bundle
        run: bash scripts/bundle.sh

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version || true

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Attach .mcpb to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dgmo-mcp.mcpb
          fail_on_unmatched_files: true
          generate_release_notes: true
